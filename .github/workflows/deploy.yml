name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm run build

      # EAT-23 board: FTP_REMOTE_PATH = public_html (live document root).
      # Hardcoded so a wrong/empty secret cannot land files outside public_html again.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: public_html/
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false

      # Fail the job if FTP wrote somewhere other than the live document root.
      - name: Verify production homepage title
        run: |
          set -euo pipefail
          EXPECTED='EatCodeSleep — AI Software Agency for Web, Apps & Automation'
          # Hostinger / proxies can lag briefly after FTP
          for i in 1 2 3 4 5 6; do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://eatcodesleep.org/?nocache=${GITHUB_RUN_ID}-${i}")
            TITLE=$(printf '%s' "$HTML" | python3 -c "import sys,re; m=re.search(r'<title[^>]*>(.*?)</title>', sys.stdin.read(), re.I|re.S); print(m.group(1).strip() if m else '')")
            # HTML entities
            TITLE=$(printf '%s' "$TITLE" | python3 -c "import sys,html; print(html.unescape(sys.stdin.read().strip()))")
            echo "Attempt $i title: $TITLE"
            if [ "$TITLE" = "$EXPECTED" ]; then
              echo "Production title OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production title mismatch after FTP deploy. Likely wrong FTP_REMOTE_PATH (not the eatcodesleep.org document root)."
          echo "Expected: $EXPECTED"
          echo "Got:      $TITLE"
          exit 1
